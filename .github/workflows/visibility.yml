name: visibility

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility
        run: gh api --method PATCH /orgs/OpenAgnt/packages/container/runtime -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
