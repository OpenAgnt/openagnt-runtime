name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [node, python, go, ruby, php, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          if [ "${{ matrix.variant }}" = "node" ]; then
            echo "name=ghcr.io/openagnt/runtime" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/openagnt/runtime-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: variants/${{ matrix.variant }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:1
