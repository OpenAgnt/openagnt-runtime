name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: >
          docker build --platform linux/amd64
          -t ghcr.io/${{ github.repository_owner }}/runtime:1 .

      - name: Push
        run: docker push ghcr.io/${{ github.repository_owner }}/runtime:1
